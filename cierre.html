<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bogotá siempre estuvo aquí</title>

    <!-- Bricolage Grotesque desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="cierre.css">
</head>

<body>

    <section class="bogota">

        <!-- El PNG trae el fondo, el título y los adornos;
             el texto y el cuadro azul van encima de la imagen -->
        <div class="bogota__caja">
            <img src="bogot.png" alt="Bogotá siempre estuvo aquí" class="bogota__img">

            <div class="bogota__contenido">

                <p class="bogota__texto">
                    En sus letras<br>
                    En sus colores<br>
                    En sus calles<br>
                    En sus historias.
                </p>

                <!-- Cuadro azul: frase + los dos botones adentro -->
                <div class="bogota__card">
                    <p class="bogota__card-texto">Tal vez no necesitamos buscar tan lejos para encontrar inspiración</p>

                    <div class="bogota__botones">
                        <a href="#" class="btn-amarillo">Comprar libro</a>
                        <a href="tutorial.html" class="btn-amarillo">Explora tutoriales del libro</a>
                    </div>
                </div>

            </div>
        </div>

    </section>

</body>

</html>
