<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>¡Aliste la tarjeta!</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/pagina1.css">
  <link rel="stylesheet" href="css/identidad.css">
</head>
<body>
  <div class="stage" id="stage">
    <img id="reader" src="img/pagina1/lector.png" alt="Lector tuLlave" draggable="false">
    <div id="zone"></div>
    <div id="lamp"></div>
    <div id="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <div id="star">
      <img src="img/pagina1/estrella.svg" alt="" draggable="false">
      <span id="starTxt">¡Aliste la tarjeta!</span>
    </div>
    <img id="swoosh" src="img/pagina1/lineas.svg" alt="" draggable="false">
    <div id="card" class="idle"><img src="img/pagina1/tarjeta.png" alt="Tarjeta TuLlave Bogotá"></div>
    <div id="hint">Arrastra la tarjeta al lector</div>
  </div>
  <audio id="paymentSound" preload="auto" playsinline>
    <source src="audio/calle-54.mp3" type="audio/mpeg">
    <source src="Calle%2054%202%20copia.m4a" type="audio/mp4">
  </audio>
  <script src="js/pago.js"></script>
</body>
</html>
