/* Botón de flecha */
:root{--rojo:#D3342E}
/* Botón de flecha (rombo azul con flecha blanca). Compartido por index, pagina2 y pagina4 */
:root{--boton-retraso:.3s}

.territorio-btn {
    width: 10%;
    aspect-ratio: 1 / 1;
    animation: boton-aparece 0.6s ease var(--boton-retraso) both;
    display: block;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
}

.territorio-btn-svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.territorio-btn:hover {
    transform: scale(1.15) rotate(-5deg);
    filter: brightness(1.1);
}

.territorio-btn:active {
    transform: scale(0.95) rotate(0deg);
}

.territorio-btn:focus-visible {
    outline: 3px solid var(--rojo);
    outline-offset: 4px;
    border-radius: 8px;
}

/* Complementos necesarios para que funcione como <button> dentro de cada página */
button.territorio-btn{padding:0;border:0;background:none;cursor:pointer;z-index:4}
.territorio-btn .territorio-btn-svg{position:static;pointer-events:none}
@keyframes boton-aparece{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.territorio-btn{animation:none;transition:none}}
.salir{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:64px}
@keyframes sale{to{transform:translateY(-100%)}}
.app.sale{animation:sale .6s cubic-bezier(.6,0,.8,.4) both}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.app.sale{animation:none}}
</style>

.zone-audio[aria-pressed="false"] .on{display:none}
.zone-audio[aria-pressed="false"] .off{display:block}
.zone-audio[hidden]{display:none}
</style>

<script>
// Edita aquí zonas y actividades. x / y = posición del pin en el mapa (en %).
const ZONAS=[
 {n:"Zona 1",x:49.4,y:34.1,a:{t:"Tarjetas",d:"Adivine dónde se consigue cada cosa.",u:"actividades/tarjetas.html",own:true,s:"audio/country-toy-2-alqueria.mp3"}},
 {n:"Zona 2",x:67.9,y:38.5,a:{t:"Postales",d:"Escuche cómo se vivía una postal y arme la suya.",u:"actividades/postales.html"}},
 {n:"Zona 3",x:31.5,y:58.1,a:{t:"Dicho y hecho",d:"Complete el refrán y conozca su historia.",u:"actividades/dicho-y-hecho.html"}},
 {n:"Zona 4",x:56.5,y:58.1,a:{t:"Brandalismo",d:"Cambie el mensaje de una marca con humor.",u:"actividades/brandalismo.html"}},
 {n:"Zona 5",x:82.3,y:72.2,a:{t:"Las onces",d:"Una los puntos y sepa por qué se llaman así.",u:"actividades/las-onces.html",own:true}},
 {n:"Zona 6",x:46,y:80,a:{t:"Qué recocha",d:"Escriba su frase y véala pasar en el bus.",u:"actividades/que-recocha.html",s:"audio/country-toy-2-transmi.mp3"}}
];
const $=id=>document.getElementById(id), sheet=$('sheet'), stage=$('stage');
let sel=-1;
ZONAS.forEach((z,i)=>{
  const b=document.createElement('button');
  b.className='pin'; b.style.left=z.x+'%'; b.style.top=z.y+'%';
  b.setAttribute('aria-label',z.n+': ver actividades'); b.setAttribute('aria-pressed','false');
  b.onclick=()=>{stopZoneAudio(false);select(i);setOpen(true);if(ZONAS[i].a.s)startZoneAudio()};
  $('map').appendChild(b);
});
function select(i){
  sel=i; const z=ZONAS[i];
  document.querySelectorAll('.pin').forEach((p,k)=>p.setAttribute('aria-pressed',k===i));
  $('atitle').textContent=z.a.t; $('adesc').textContent=z.a.d;
  $('zoneAudio').hidden=!z.a.s;
  $('zoneAudio').setAttribute('aria-pressed','false');
  $('zoneAudio').setAttribute('aria-label',z.a.s?'Reproducir audio de '+z.n:'Audio no disponible en '+z.n);
  const pin=document.querySelectorAll('.pin')[i], r=pin.getBoundingClientRect(), s=stage.getBoundingClientRect();
  const limit=stage.getBoundingClientRect().bottom-sheet.offsetHeight-40;
  if(window.__ready&&r.bottom>limit) stage.scrollBy({top:r.bottom-limit,behavior:'smooth'});
}
function setOpen(o){
  sheet.classList.toggle('hidden',!o);
  $('hide').setAttribute('aria-expanded',o);
  stage.style.setProperty('--pad',(o?sheet.offsetHeight+16:24)+'px');
  if(window.__ready)o&&$('hide').focus({preventScroll:true});
}
$('hide').onclick=()=>{setOpen(false);stopZoneAudio(true)};
const bg=$('bg'), snd=$('snd'), zoneSound=$('zoneAudio'), zonePlayer=new Audio(); let soundOn=true;
function play(){
  if(soundOn&&bg.paused&&zonePlayer.paused&&$('screen').hidden){
    bg.play().catch(error=>console.error('No se pudo reproducir el sonido del mapa:',error));
  }
}
function setZoneSoundState(playing){
  zoneSound.setAttribute('aria-pressed',String(playing));
  zoneSound.setAttribute('aria-label',(playing?'Pausar':'Reproducir')+' audio de '+ZONAS[sel].n);
}
function stopZoneAudio(resumeBackground){
  zonePlayer.pause();
  if(zonePlayer.src)zonePlayer.currentTime=0;
  setZoneSoundState(false);
  if(resumeBackground)play();
}
function startZoneAudio(){
  const src=ZONAS[sel].a.s;
  if(!src)return;
  bg.pause();
  zonePlayer.src=src;
  zonePlayer.play().catch(error=>{
    setZoneSoundState(false);
    console.error('No se pudo reproducir el audio de '+ZONAS[sel].n+':',error);
    play();
  });
}
zonePlayer.addEventListener('play',()=>setZoneSoundState(true));
zonePlayer.addEventListener('pause',()=>setZoneSoundState(false));
zonePlayer.addEventListener('ended',()=>{setZoneSoundState(false);play()});
zonePlayer.addEventListener('error',()=>console.error('No se pudo cargar el audio de '+ZONAS[sel].n+':',zonePlayer.error));
document.addEventListener('pointerdown',e=>{ if(!snd.contains(e.target)&&!zoneSound.contains(e.target)) play(); });
snd.onclick=()=>{
  soundOn=!soundOn;
  snd.setAttribute('aria-pressed',soundOn);
  if(soundOn)play();
  else{bg.pause();stopZoneAudio(false)}
};
zoneSound.onclick=()=>{if(zonePlayer.paused)startZoneAudio();else stopZoneAudio(true)};
const frame=$('frame');
function openAct(){
  const a=ZONAS[sel].a;
  stopZoneAudio(false);
  frame.src=encodeURI(a.u);
  $('sback').hidden=!!a.own;
  $('screen').hidden=false;
  bg.pause();
  ($('sback').hidden?frame:$('sback')).focus();
}
function closeAct(){
  $('screen').hidden=true;
  frame.src='about:blank';
  if(soundOn) bg.play().catch(()=>{});
  $('more').focus();
}
$('more').onclick=openAct;
$('sback').onclick=closeAct;
window.addEventListener('message',e=>{ if(e.data&&e.data.quiubo==='mapa'&&!$('screen').hidden) closeAct(); });
select(0); setOpen(false); window.__ready=true;
play();
// Ajusta el mapa al alto disponible para que quepa completo, sin scroll.
const mapEl=$('map'), mapImg=mapEl.querySelector('img');
function fitMap(){
  if(!mapImg.naturalWidth) return;
  const r=mapImg.naturalWidth/mapImg.naturalHeight;
  const avail=stage.clientHeight-mapEl.offsetTop-24;
  const w=Math.max(150,Math.min(avail*r,380,stage.clientWidth*.84));
  mapEl.style.setProperty('--mw',w+'px');
}
if(mapImg.complete) fitMap(); else mapImg.addEventListener('load',fitMap);
window.addEventListener('resize',fitMap);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitMap);
if(window.ResizeObserver){ const ro=new ResizeObserver(fitMap); ro.observe(stage); ro.observe(document.querySelector('.intro')); }
window.addEventListener('resize',()=>{if(!sheet.classList.contains('hidden'))stage.style.setProperty('--pad',(sheet.offsetHeight+16)+'px')});
// Flecha inferior derecha: lleva a la página "¿Ya te vas?"
const PAGINA_SALIR='ya-te-vas.html';
$('salir').onclick=()=>{
  stopZoneAudio(false);
  bg.pause();
  const quieto=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(quieto){location.href=PAGINA_SALIR;return}
  $('app').classList.add('sale');
  setTimeout(()=>{location.href=PAGINA_SALIR},550);
};
</script>
</body>
